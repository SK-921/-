<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AI vol1 cover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: "IPAPGothic", sans-serif; }
  #cover { width: 640px; height: 335px; position: relative; overflow: hidden; color: #fff;
           background: linear-gradient(135deg, #111827 0%, #312e81 60%, #4338ca 100%); }
  .inner { position: absolute; inset: 0; padding: 30px 34px; display: flex; flex-direction: column; }
  .small { font-size: 16px; opacity: .85; letter-spacing: 1px; }
  .title { font-size: 34px; font-weight: bold; line-height: 1.3; margin-top: 10px; }
  .title .hl { color: #fde68a; }
  .subtitle { font-size: 17px; margin-top: 12px; opacity: .95; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: auto; }
  .chip { font-size: 14px; background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.5);
          padding: 4px 10px; border-radius: 999px; }
  /* 右上：ターミナル風の小窓（実際の memory.md の1行） */
  .term { position: absolute; right: 28px; top: 26px; width: 210px; background: #0b1020; border: 1.5px solid #6366f1;
          border-radius: 10px; padding: 9px 11px 11px; font-family: "IPAGothic", monospace; font-size: 11px; line-height: 1.55; }
  .term .bar { display: flex; gap: 5px; margin-bottom: 7px; }
  .term .bar i { width: 8px; height: 8px; border-radius: 50%; background: #475569; display: block; }
  .term .p { color: #a5b4fc; }
  .term .ok { color: #86efac; }
  .term .ng { color: #fca5a5; }
</style>
</head>
<body>
<div id="cover">
  <div class="inner">
    <div class="small">AI活用シリーズ 第1弾</div>
    <div class="title">専門学校生が<br><span class="hl">Claude Code</span> で<br>自分専用のAI秘書を<br>作った記録</div>
    <div class="subtitle">実際の設定ファイルと失敗のログつき</div>
    <div class="chips">
      <span class="chip">判断軸</span><span class="chip">仕事ボード</span><span class="chip">作る担当とチェック担当</span>
      <span class="chip">権限の絞り方</span><span class="chip">定期実行</span>
    </div>
  </div>
  <div class="term">
    <div class="bar"><i></i><i></i><i></i></div>
    <div><span class="p">#</span> memory.md より（失敗の記録）</div>
    <div class="ng">✗ 締切が曜日だけだった</div>
    <div class="ok">→ 日付で書く</div>
    <div class="ng">✗ 信頼済みにしていなかった</div>
    <div class="ok">→ 最初に承認する</div>
  </div>
</div>
</body>
</html>
